plugins {
    id 'com.android.application'
}

android {
    namespace 'im.marin.onyxtv'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('im.marin.onyxtv')
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.1.0'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

abstract class SyncOnyxAssetsTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getWallpapersDir()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputBannersDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void sync() {
        File outRoot = outputDir.get().asFile
        project.delete(outRoot)
        File wpOut = new File(outRoot, 'wallpapers')
        File inOut = new File(outRoot, 'input_banners')
        wpOut.mkdirs()
        inOut.mkdirs()

        File wpSrc = wallpapersDir.get().asFile
        wpSrc.eachFileRecurse { File f ->
            if (!f.isFile()) return
            String lower = f.name.toLowerCase(Locale.ROOT)
            if (!(lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png') || lower.endsWith('.webp'))) return
            String rel = wpSrc.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/')
            String[] parts = rel.split('/')
            File dst = parts.length == 2 ? new File(wpOut, "${parts[0]}_${parts[1]}") : new File(wpOut, rel)
            dst.parentFile.mkdirs()
            java.nio.file.Files.copy(f.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        File inSrc = inputBannersDir.get().asFile
        inSrc.eachFile { File f ->
            if (!f.isFile()) return
            String lower = f.name.toLowerCase(Locale.ROOT)
            if (!(lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png') || lower.endsWith('.webp'))) return
            java.nio.file.Files.copy(f.toPath(), new File(inOut, f.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

def syncOnyxAssets = tasks.register('syncOnyxAssets', SyncOnyxAssetsTask) {
    wallpapersDir.set(layout.projectDirectory.dir('../../img/wallpapers'))
    inputBannersDir.set(layout.projectDirectory.dir('../../img/banners'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(syncOnyxAssets, { it.outputDir })
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
